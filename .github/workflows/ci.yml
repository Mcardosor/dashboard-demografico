name: CI

# O CI cobre: o código passa no linter, a suíte de testes passa, a imagem
# constrói, e o que ela instala é exatamente o que está no lock.
#
# O que NÃO é coberto: se um número do painel está certo. Isso continua
# dependendo de olhar o painel — ver a ressalva no README. E os tetos de tempo
# absoluto, que levam a marca `tempo` e ficam de fora aqui — ver pytest.ini.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 porque é a da imagem de produção (python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install ruff==0.16.2
      - run: ruff check .

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Do lock, e não de requirements-dev.txt: os testes precisam das mesmas
      # versões que rodam em produção, e o dev traz geopandas e topojson, que
      # são de build (scripts/preparar_geometria.py) e que a suíte não importa
      # de propósito — instalá-las aqui custaria minutos por nada.
      - run: pip install -r requirements.lock.txt pytest==8.3.4

      # `-m "not tempo"` exclui os tetos de relógio de parede. Num runner
      # compartilhado eles medem a carga da máquina alheia; o que sobra é
      # determinístico — payload, malha, cor, enquadramento — mais a
      # comparação relativa entre o mapa e os gráficos.
      - run: pytest -m "not tempo" -q

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Constrói a imagem
        run: docker build -t demografico:ci .

      # O `tr -d '\r'` não é supérfluo: quem commita do Windows pode gravar o
      # lock com CRLF, e aí o diff acusa todas as linhas como diferentes.
      - name: Confere que a imagem tem as versões do lock
        run: |
          docker run --rm --entrypoint pip demografico:ci freeze | tr -d '\r' | sort -f > /tmp/imagem.txt
          grep -v '^#' requirements.lock.txt | grep -v '^$' | tr -d '\r' | sort -f > /tmp/lock.txt
          diff /tmp/lock.txt /tmp/imagem.txt
