[pytest]
testpaths = tests

# A raiz do projeto no `sys.path`, para os testes acharem `src`.
#
# Sem isto, `python -m pytest` funciona e `pytest` puro não: o primeiro põe o
# cwd no caminho de importação, o segundo não. Amarrar aqui faz as duas formas
# de invocar darem o mesmo resultado — o CI chama a segunda.
pythonpath = .

# `tempo` marca os testes que cronometram relógio de parede contra um teto
# absoluto. Eles valem na máquina de quem desenvolve, onde o número é
# comparável ao de docs/performance.md, e não valem num runner de CI
# compartilhado: ali a medida diz mais sobre a carga da máquina alheia do que
# sobre o código. Um teste que falha por motivo alheio vira ruído e acaba
# desligado — junto com os que prestavam.
#
# O CI roda `-m "not tempo"`. O que ele continua prendendo é tudo que é
# determinístico: payload, malha, cor, enquadramento, e a comparação
# *relativa* entre o mapa e os gráficos, que independe da velocidade da
# máquina.
markers =
    tempo: cronometra tempo absoluto; não roda no CI
