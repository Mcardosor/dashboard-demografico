# Ruff — só as regras que pegam bug. Estilo fica por conta de quem escreve.
# Mesma config dos outros painéis da família Cenários+.

target-version = "py311"

[lint]
select = [
    "E4",  # imports mal colocados
    "E7",  # comparações e nomes problemáticos
    "E9",  # erro de sintaxe / falha de parse
    "F",   # pyflakes: nome indefinido, import não usado, f-string sem campo
    "B",   # flake8-bugbear: armadilhas reais de runtime
]

ignore = [
    # B905 (`zip()` sem `strict=`) — desligada em toda a família. O padrão
    # `zip(st.columns(n), itens)` aparece em todos os painéis, e em vários
    # deles a diferença de tamanho é intencional (coluna espaçadora, linha
    # incompleta de KPIs). `strict=True` transformaria layout em exceção.
    # Aqui as duas listas têm 4 elementos, mas a regra fica off por coerência.
    "B905",
]

# E501 (linha longa) não entra: o CSS embutido passa de 120 colunas por
# natureza. Seriam dezenas de avisos e nenhum bug.

# "I" (ordem de imports) também não: o isort do ruff só quebra import longo em
# uma linha por nome, e reescreveria blocos que já estão legíveis.
